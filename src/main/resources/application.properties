
# Nombre de la aplicacion
spring.application.name=cacheperformance

# Puerto del backend
server.port=8080

# Base de datos H2 persistente
spring.datasource.url=jdbc:h2:file:./data/cacheperformance
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Configuracion JPA
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Consola H2
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console


# Configuracion de Caffeine
spring.cache.type=caffeine
spring.cache.cache-names=productos
spring.cache.caffeine.spec=maximumSize=100,expireAfterWrite=600s

